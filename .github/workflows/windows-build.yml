name: Windows build

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    name: Build, test, and publish
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run unit tests
        run: dotnet test tests/NetPulse.Tests/NetPulse.Tests.csproj --configuration Release --logger "console;verbosity=normal"

      - name: Publish self-contained Windows x64 build
        run: >-
          dotnet publish src/NetPulse/NetPulse.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output artifacts/publish

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: NetPulse-win-x64
          path: artifacts/publish/
          if-no-files-found: error
          retention-days: 14
